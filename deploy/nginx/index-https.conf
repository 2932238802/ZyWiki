# ---------------------------------------------------------------------------
# 主站 HTTPS + 域名跳转
#
#   安装位置：/etc/nginx/sites-available/index-https.conf
#   启用：     ln -s /etc/nginx/sites-available/index-https.conf /etc/nginx/sites-enabled/
#   证书：     certbot certonly --webroot -w /var/www/index -d los-theseus.site
#
#   注意：IP 访问（http://47.111.175.191/）保持 80 明文，不做跳转，
#         否则浏览器会用域名证书校验 IP，必然报证书不匹配。
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name los-theseus.site;

    root /var/www/index;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/los-theseus.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/los-theseus.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/index.https.access.log;
    error_log  /var/log/nginx/index.https.error.log;

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        try_files $uri $uri/ =404;
    }
}

# 同一域名走 80 时直接跳 HTTPS；证书续期用的 acme-challenge 保留明文
server {
    listen 80;
    listen [::]:80;
    server_name los-theseus.site;

    location /.well-known/acme-challenge/ {
        root /var/www/index;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
