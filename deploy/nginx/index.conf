# ---------------------------------------------------------------------------
# 主站（80）：默认 server，承接 IP 直连与未匹配的 Host
#
#   安装位置：/etc/nginx/sites-available/index.conf
#   启用：     ln -s /etc/nginx/sites-available/index.conf /etc/nginx/sites-enabled/
#
#   域名 los-theseus.site 的 80 请求由 index-https.conf 里的跳转块负责，
#   所以这里不写 server_name los-theseus.site，否则会触发
#   "conflicting server name ... ignored" 警告，跳转也不会生效。
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.111.175.191 _;

    root /var/www/index;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/index.access.log;
    error_log  /var/log/nginx/index.error.log;

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        try_files $uri $uri/ =404;
    }
}
