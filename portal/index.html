<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LosAngelous</title>
<meta name="description" content="LosAngelous"><link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e8;
    --dim: #7a7a7a;
    --line: #232323;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: min(820px, 92vw); margin: 0 auto; }

  main { flex: 1; padding: 82px 0 40px; }

  .brand {
    font-size: 13px;
    letter-spacing: .2em;
    color: var(--fg);
    margin-bottom: 26px;
    font-weight: 500;
  }
  .list { border-top: 1px solid var(--line); }

  a.row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 17px 10px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
    transition: background .1s linear, color .1s linear;
  }
  a.row:hover,
  a.row:focus-visible {
    background: #ffffff;
    color: #000000;
    outline: none;
  }
  a.row:hover .idx,
  a.row:hover .desc,
  a.row:focus-visible .idx,
  a.row:focus-visible .desc { color: #4a4a4a; }
  a.row:hover .port,
  a.row:focus-visible .port { color: #000000; border-color: #000000; }

  .idx {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .08em;
  }
  .name {
    display: block;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .02em;
  }
  .desc {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .02em;
  }
  .port {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--line);
    padding: 2px 8px;
    letter-spacing: .06em;
  }

  footer { padding: 0 0 34px; }
  footer .row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: .04em;
  }
  footer a {
    color: var(--dim);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  footer a:hover { color: var(--fg); border-bottom-color: var(--fg); }
</style>
</head>
<body>
  <main class="wrap"><div class="brand">LosAngelous</div><div class="list">
      <a class="row" href="http://los-theseus.site:8080/" target="_blank" rel="noopener">
        <span class="idx">01</span>
        <span>
          <span class="name">Theseus 训练平台</span>
          <span class="desc">在线编程训练平台</span>
        </span>
        <span class="port">8080</span>
      </a>

      <a class="row" href="http://los-theseus.site:8081/" target="_blank" rel="noopener">
        <span class="idx">02</span>
        <span>
          <span class="name">Forus</span>
          <span class="desc">Forus 应用</span>
        </span>
        <span class="port">8081</span>
      </a>

      <a class="row" href="http://los-theseus.site:8787/" target="_blank" rel="noopener">
        <span class="idx">03</span>
        <span>
          <span class="name">LosNote 题库</span>
          <span class="desc">笔记与题库工具</span>
        </span>
        <span class="port">8787</span>
      </a>

      <a class="row" href="http://los-theseus.site:8082/" target="_blank" rel="noopener">
        <span class="idx">04</span>
        <span>
          <span class="name">大学现状自评</span>
          <span class="desc">自评问卷</span>
        </span>
        <span class="port">8082</span>
      </a>

      <a class="row" href="http://los-theseus.site:8790/" target="_blank" rel="noopener">
        <span class="idx">05</span>
        <span>
          <span class="name">LosPool API</span>
          <span class="desc">模型池接口 v1</span>
        </span>
        <span class="port">8790</span>
      </a>

      <a class="row" href="/zywiki/">
        <span class="idx">06</span>
        <span>
          <span class="name">大学实用就业指南</span>
          <span class="desc">就业指南 wiki</span>
        </span>
        <span class="port">80</span>
      </a>
    </div>
  </main>

  <footer class="wrap">
    <div class="row">
      <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">浙ICP备2026096838号-1</a>
      <a href="https://github.com/2932238802" target="_blank" rel="noopener">LosAngelous</a>
    </div>
  </footer>
</body>
</html>
